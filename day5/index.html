<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Directory</title>
  <style>
    body {
      background-color: #f6faf6;
      font-family: system-ui, sans-serif;
      max-width: 700px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }
    .controls {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    button {
      padding: 0.5rem 1rem;
      cursor: pointer;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }
    input {
      padding: 0.5rem;
      flex: 1;
      min-width: 200px;
    }
    #status {
      font-weight: bold;
      min-height: 1.5em;
    }
    #status.error { color: #b00020; }
    #status.success { color: #0a7a0a; }
    ul { list-style: none; padding: 0; }
    li {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      margin-bottom: 0.75rem;
    }
    li h3 { margin: 0 0 0.25rem; }
    li p { margin: 0.15rem 0; color: #444; }
  </style>
</head>
<body>
  <h1>User Directory</h1>

  <div class="controls">
    <button id="load-users">Load Users</button>
    <label for="filter-input">Filter by name:</label>
    <input
      type="text"
      id="filter-input"
      placeholder="Type a name..."
      autocomplete="off"
    />
  </div>

  <p id="status"></p>
  <ul id="users-list"></ul>

  <script src="users.js" defer></script>
</body>
</html>
