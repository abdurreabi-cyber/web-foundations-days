<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Capture your thoughts quickly and neatly.</p>
  </header>

  <main>
    <section aria-labelledby="add-note-heading">
      <h2 id="add-note-heading">Add a note</h2>

      <form id="note-form">
        <div class="form-group">
          <label for="note-input">Note</label>
          <input
            id="note-input"
            name="note"
            type="text"
            placeholder="Write a note..."
            autocomplete="off"
          >
        </div>

        <div class="form-group">
          <label for="note-category">Category</label>
          <select id="note-category" name="category">
            <option value="Personal">Personal</option>
            <option value="Work">Work</option>
            <option value="Study">Study</option>
          </select>
        </div>

        <button type="submit">Add Note</button>
      </form>

      <p id="error-message" class="error" role="alert" aria-live="polite"></p>
    </section>

    <section aria-labelledby="notes-heading">
      <h2 id="notes-heading">Your notes</h2>

      <div class="search-group">
        <label for="search-input">Search notes</label>
        <input id="search-input" type="search" placeholder="Search notes...">
      </div>

      <p id="note-count"></p>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes. Built for learning.</p>
  </footer>
</body>
</html>
